[project]
name = "usmelt"

description = "Controls microsecond melting laser"
authors = [
    {name = "Filipe Maia", email = "filipe.c.maia@gmail.com"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.7"
dependencies = [
    "pyserial",
    # usmark_gui.py (the image-marker GUI) is built on Qt; markup.py too.
    "PySide6",
    # usmark_gui.py uses Pillow for opening/exporting annotated images.
    "Pillow",
    # playsound was dropped: it fails to install on Python >= 3.12
    # (its setup.py dies with UnicodeDecodeError).
    # simpleaudio is also gone: no wheels for modern Pythons, segfault issues.
    # Sound playback uses winsound on Windows (stdlib) and soundfile+numpy as a
    # cross-platform fallback (prebuilt wheels on Windows/Linux/macOS).
    'soundfile; sys_platform != "win32"',
]
classifiers = [
    "Programming Language :: Python :: 3",
]

dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["usmelt"]

[tool.setuptools.dynamic]
version = {attr = "usmelt.__version__"}