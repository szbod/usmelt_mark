[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usmelt"

description = "Controls microsecond melting laser"
authors = [
    {name = "Filipe Maia", email = "filipe.c.maia@gmail.com"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.7"
dependencies = [
    "pyserial",
    # playsound 1.3.0 (the latest on PyPI) fails to build its wheel on Python 3.12+
    # (its setup.py uses inspect.getsource() on an exec'd string), so it was dropped.
    # SimpleAudio (py-simple-audio) is used instead; it builds from source via setuptools.
    # On macOS, pin the older playsound==1.2.2 wheel, which still works there and
    # avoids the seg fault reported in https://github.com/hamiltron/py-simple-audio/issues/72
    "SimpleAudio>=1.0.4 ; platform_system != 'Darwin'",
    "playsound==1.2.2 ; platform_system == 'Darwin'",
]
classifiers = [
    "Programming Language :: Python :: 3",
]

dynamic = ["version"]

[tool.setuptools]
packages = ["usmelt"]

[tool.setuptools.dynamic]
version = {attr = "usmelt.__version__"}